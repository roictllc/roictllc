# Production on one VPS (spec §2.2): web + worker + caddy (+ optional postgres, clamav). Cloudflare in front.
services:
  web:
    build: { context: ../.., dockerfile: infrastructure/docker/Dockerfile.web }
    env_file: /opt/roi/.env
    restart: unless-stopped
    read_only: true
    tmpfs: [/tmp]
    deploy: { resources: { limits: { memory: 1g, cpus: '1.0' } } }
    healthcheck: { test: ["CMD", "node", "-e", "fetch('http://localhost:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"], interval: 30s }
  worker:
    build: { context: ../.., dockerfile: infrastructure/docker/Dockerfile.worker }
    env_file: /opt/roi/.env
    restart: unless-stopped
    deploy: { resources: { limits: { memory: 2g, cpus: '1.5' } } }
    depends_on: [clamav]
  clamav:
    image: clamav/clamav:stable
    restart: unless-stopped
  caddy:
    image: caddy:2
    restart: unless-stopped
    ports: ["80:80", "443:443"]
    volumes: [../caddy/Caddyfile:/etc/caddy/Caddyfile:ro, caddy_data:/data, caddy_config:/config]
    depends_on: [web]
  postgres:
    profiles: [selfhosted-db]
    image: postgres:16
    environment: { POSTGRES_USER: roi, POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?set}", POSTGRES_DB: roi }
    volumes: [pg_data:/var/lib/postgresql/data]
    restart: unless-stopped
volumes: { caddy_data: {}, caddy_config: {}, pg_data: {} }
