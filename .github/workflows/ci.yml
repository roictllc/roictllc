name: CI
on:
  push: { branches: [main] }
  pull_request:
permissions: { contents: read, security-events: write }
jobs:
  test:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_USER: roi, POSTGRES_PASSWORD: roi_local_dev, POSTGRES_DB: roi_test }
        ports: ['5432:5432']
        options: --health-cmd pg_isready --health-interval 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://roi:roi_local_dev@localhost:5432/roi_test
      DATABASE_URL: postgresql://roi:roi_local_dev@localhost:5432/roi_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg poppler-utils qpdf
      - run: npm ci
      - run: npm run db:generate
      - name: Real Prisma migrate deploy + seed twice + drift check (mirrors the Vercel build)
        env:
          DATABASE_URL: postgresql://roi:roi_local_dev@localhost:5432/roi_drift
          SEED_ADMIN_EMAIL: ci-admin@example.test
          SEED_ADMIN_PASSWORD: ci-only-long-passphrase-0123
        run: |
          PGPASSWORD=roi_local_dev psql -h localhost -U roi -d roi_test -c 'CREATE DATABASE roi_drift'
          npm run db:migrate:deploy
          npm run db:seed
          npm run db:seed
          npm run db:check
          set +e
          npx prisma migrate diff --config packages/database/prisma.config.ts --from-config-datasource --to-schema packages/database/prisma/schema.prisma --script --exit-code > drift.sql
          code=$?
          set -e
          if [ "$code" = "2" ]; then echo "::error::Migrations do not match schema.prisma. Missing SQL:"; cat drift.sql; exit 1; fi
          if [ "$code" != "0" ]; then echo "::error::prisma migrate diff failed"; cat drift.sql; exit 1; fi
          echo "No drift: migrations match schema.prisma"
      - run: npm run typecheck
      - run: npx tsc -p apps/web/tsconfig.json --noEmit
      - run: npm test
      - run: npm run build -w @roi/web
        env: { APP_URL: http://localhost:3000, SESSION_SECRET: ci-session-secret-0123456789abcdefghijklmnop, INTEGRATION_ENCRYPTION_KEY: AQEBAQEBAQEBAQEBAQEBAQEBAQEBAQEBAQEBAQEBAQE= }
      - name: Link check of the built site
        run: |
          npm run db:seed
          (npx next start apps/web -p 3000 &) && sleep 8
          npm run link-check -- http://localhost:3000
        env: { APP_URL: http://localhost:3000, SESSION_SECRET: ci-session-secret-0123456789abcdefghijklmnop, INTEGRATION_ENCRYPTION_KEY: AQEBAQEBAQEBAQEBAQEBAQEBAQEBAQEBAQEBAQEBAQE= }
  secrets-scan:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: gitleaks/gitleaks-action@v2
        env: { GITHUB_TOKEN: '${{ secrets.GITHUB_TOKEN }}' }
  codeql:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v3
        with: { languages: javascript-typescript }
      - uses: github/codeql-action/analyze@v3
  audit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm ci && npm audit --omit=dev --audit-level=high
