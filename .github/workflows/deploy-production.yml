name: Deploy production (VPS)
on: { workflow_dispatch: {} }
concurrency: production
jobs:
  deploy:
    runs-on: ubuntu-24.04
    environment: production   # requires manual approval (configure reviewers in GitHub → Environments)
    steps:
      - uses: actions/checkout@v7
      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh && echo "${{ secrets.SERVER_SSH_KEY }}" > ~/.ssh/id_ed25519 && chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "${{ secrets.SERVER_SSH_HOST }}" >> ~/.ssh/known_hosts
      - name: Ship & deploy (migrations first, smoke tests, automatic rollback)
        run: |
          rsync -az --delete --exclude node_modules --exclude .git ./ "${{ secrets.SERVER_SSH_USER }}@${{ secrets.SERVER_SSH_HOST }}:/opt/roi/next/"
          ssh "${{ secrets.SERVER_SSH_USER }}@${{ secrets.SERVER_SSH_HOST }}" 'bash /opt/roi/next/infrastructure/scripts/deploy.sh'
